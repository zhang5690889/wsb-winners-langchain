[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsb-winners-langchain"
version = "0.1.0"
description = "WSB winners recommendation via LangChain structured extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wsb-winners = "wsb_winners.cli:main"

[tool.setuptools]
packages = ["wsb_winners"]

[tool.pytest.ini_options]
testpaths = ["tests"]